# SMEFT EFT Points Configuration
# Define the SMEFT parameter points you want to generate
# Format: ggHH_CH_X_CHBox_Y_CHD_Z_CuH_W_CHG_V
# Values: CH, CHBox, CHD, CuH, CHG (dimension-6 Wilson coefficients in TeV^-2)
# xs: cross-section in fb (femtobarns)

# SM point (all Wilson coefficients = 0)
ggHH_CH_0p00_CHBox_0p00_CHD_0p00_CuH_0p00_CHG_0p00:
  CH: 0.0
  CHBox: 0.0
  CHD: 0.0
  CuH: 0.0
  CHG: 0.0
  xs: 31.05  # SM gg->HH cross-section at 13 TeV

# CH scan (varying cH)
ggHH_CH_1p00_CHBox_0p00_CHD_0p00_CuH_0p00_CHG_0p00:
  CH: 1.0
  CHBox: 0.0
  CHD: 0.0
  CuH: 0.0
  CHG: 0.0
  xs: 45.23

ggHH_CH_m1p00_CHBox_0p00_CHD_0p00_CuH_0p00_CHG_0p00:
