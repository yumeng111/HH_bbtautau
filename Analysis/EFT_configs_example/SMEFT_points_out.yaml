# Note: 
# 1. Cross-sections should be calculated with appropriate tools (MadGraph5_aMC@NLO + SMEFT@NLO)
# 2. The relationship between HEFT and SMEFT:
#    - HEFT kl <-> SMEFT: combination of CH and CHBox
#    - HEFT kt <-> SMEFT: related to CuH
#    - HEFT c2 <-> SMEFT: related to CHBox and CHD
# 3. SMEFT provides a more fundamental EFT framework valid at higher energies

